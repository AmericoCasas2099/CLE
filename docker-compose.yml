services:
  gateway:
    image: nginx:stable-alpine
    container_name: cle-gateway
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:80"

    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      usuarios-service:
        condition: service_healthy

  usuarios-service:
    build:
      context: ./backend/microservices/usuarios-service
      dockerfile: Dockerfile

    container_name: cle-usuarios-service
    restart: unless-stopped

    env_file:
      - ./backend/microservices/usuarios-service/.env

    expose:
      - "3001"

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
