
server {
    listen 80;
    server_name _;

    # =========================================
    # USUARIOS-SERVICE (Puerto 3001)
    # =========================================

    # Autenticación
    location /api/v1/auth/ {
        proxy_pass http://usuarios-service:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Administración de usuarios
    location /api/v1/usuarios {
        proxy_pass http://usuarios-service:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Catálogo de roles
    location = /api/v1/roles {
        proxy_pass http://usuarios-service:3001;
    }

    # Catálogo de estatus de usuarios
    location = /api/v1/estatus-usuarios {
        proxy_pass http://usuarios-service:3001;
    }

    # =========================================
    # ACADEMICO-SERVICE (Puerto 3002)
    # =========================================

    # Gestión de maestros
    location /api/v1/maestros {
        proxy_pass http://academico-service:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gestión de alumnos
    location /api/v1/alumnos {
        proxy_pass http://academico-service:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================
    # GATEWAY
    # =========================================

    # Comprobación del gateway
    location = /health {
        return 200 '{"servicio":"cle-gateway","estado":"ok"}';
        add_header Content-Type application/json;
    }

    # Rutas no configuradas
    location / {
        return 404;
    }
}
