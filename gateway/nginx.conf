
server {
    listen 80;
    server_name _;

    # =========================================
    # USUARIOS-SERVICE (Puerto 3001)
    # =========================================

    # Autenticación
    location /api/v1/auth/ {
        proxy_pass http://usuarios-service:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Administración de usuarios
    location /api/v1/usuarios {
        proxy_pass http://usuarios-service:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Catálogo de roles
    location = /api/v1/roles {
        proxy_pass http://usuarios-service:3001;
    }

    # Catálogo de estatus de usuarios
    location = /api/v1/estatus-usuarios {
        proxy_pass http://usuarios-service:3001;
    }

    # =========================================
    # ACADEMICO-SERVICE (Puerto 3002)
    # =========================================

    # Gestión de maestros
    location /api/v1/maestros {
        proxy_pass http://academico-service:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gestión de alumnos
    location /api/v1/alumnos {
        proxy_pass http://academico-service:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Catálogo de idiomas
    location /api/v1/idiomas {
        proxy_pass http://academico-service:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Catálogo de niveles
    location /api/v1/niveles {
        proxy_pass http://academico-service:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Catálogos académicos
    location /api/v1/catalogos/ {
        proxy_pass http://academico-service:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================
    # INFRAESTRUCTURA-SERVICE (Puerto 3003)
    # =========================================

    # Gestión de campus
    location /api/v1/campus {
        proxy_pass http://infraestructura-service:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gestión de salones
    location /api/v1/salones {
        proxy_pass http://infraestructura-service:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================
    # INSCRIPCIONES-SERVICE (Puerto 3004)
    # =========================================

    # Gestión de periodos
    location /api/v1/periodos {
        proxy_pass http://inscripciones-service:3004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gestión de grupos, alumnos y calificaciones
    location /api/v1/grupos {
        proxy_pass http://inscripciones-service:3004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gestión de horarios
    location /api/v1/horarios {
        proxy_pass http://inscripciones-service:3004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Inscripciones y calificaciones individuales
    location /api/v1/inscripciones {
        proxy_pass http://inscripciones-service:3004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================
    # GATEWAY
    # =========================================

    # Comprobación del gateway
    location = /health {
        default_type application/json;
        return 200 '{"servicio":"cle-gateway","estado":"ok"}';
    }

    # Rutas no configuradas
    location / {
        return 404;
    }
}
