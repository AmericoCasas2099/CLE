openapi: 3.0.3
info:
  title: CLE - Microservicio de Usuarios
  version: 1.3.0
  description: 'Contrato OpenAPI del microservicio de usuarios del CLE.

    Inicio de sesión con correo y contraseña. La creación de cuentas es exclusiva 
    del Administrador. No incluye autorregistro ni verificación de correo.

    '
servers:
- url: https://aircraft-sept-maker-mug.trycloudflare.com
  description: /health responde desde gateway Nginx
- url: http://localhost:3001
  description: Desarrollo local (acceso directo al microservicio)
tags:
- name: Autenticación
- name: Usuarios
- name: Catálogos
security:
- bearerAuth: []
paths:
  /health:
    get:
      tags:
      - Autenticación
      summary: Estado básico del microservicio
      security: []
      responses:
        '200':
          description: Servicio disponible
          content:
            application/json:
              schema:
                type: object
                properties:
                  servicio:
                    type: string
                    example: usuarios-service
                  estado:
                    type: string
                    example: ok
  /api/v1/auth/login:
    post:
      tags:
      - Autenticación
      summary: Iniciar sesión con correo electrónico
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credenciales válidas. Devuelve un JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Cuenta inactiva u otro bloqueo aplicable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/perfil:
    get:
      tags:
      - Autenticación
      summary: Consultar perfil del usuario autenticado
      responses:
        '200':
          description: Información del perfil
          content:
            application/json:
              schema:
                type: object
                properties:
                  usuario:
                    $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
      - Autenticación
      summary: Modificar el correo electrónico propio
      description: Cualquier usuario autenticado y activo puede cambiar su propio correo, confirmando su contraseña
        actual. El ID se obtiene del JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarCorreoPropioRequest'
      responses:
        '200':
          description: Correo actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActualizarCorreoPropioResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/cambiar-password:
    put:
      tags:
      - Autenticación
      summary: Cambiar la propia contraseña
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarPasswordRequest'
      responses:
        '204':
          description: Contraseña actualizada sin contenido de respuesta
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/usuarios:
    post:
      tags:
      - Usuarios
      summary: Crear un usuario (solo Administrador)
      description: El Administrador selecciona rol_id; el correo se requiere para acceso por correo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearUsuarioRequest'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags:
      - Usuarios
      summary: Listar usuarios paginados (solo Administrador)
      parameters:
      - in: query
        name: pagina
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: limite
        schema:
          type: integer
          minimum: 1
          default: 10
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaUsuarios'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/usuarios/{usuarioId}:
    parameters:
    - $ref: '#/components/parameters/UsuarioId'
    get:
      tags:
      - Usuarios
      summary: Consultar usuario por ID (solo Administrador)
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Usuarios
      summary: Modificar correo de un usuario (solo Administrador)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarCorreoRequest'
      responses:
        '200':
          description: Usuario modificado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/usuarios/{usuarioId}/rol:
    patch:
      tags:
      - Usuarios
      summary: Cambiar rol de un usuario (solo Administrador)
      description: No se permite degradar al último Administrador activo.
      parameters:
      - $ref: '#/components/parameters/UsuarioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - rol_id
              properties:
                rol_id:
                  type: integer
                  minimum: 1
              additionalProperties: false
      responses:
        '200':
          description: Rol actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/usuarios/{usuarioId}/estatus:
    patch:
      tags:
      - Usuarios
      summary: Activar o inactivar usuario (solo Administrador)
      description: No se permite inactivar al último Administrador activo.
      parameters:
      - $ref: '#/components/parameters/UsuarioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - estatus_id
              properties:
                estatus_id:
                  type: integer
                  minimum: 1
              additionalProperties: false
      responses:
        '200':
          description: Estatus actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/roles:
    get:
      tags:
      - Catálogos
      summary: Consultar roles (solo Administrador)
      responses:
        '200':
          description: Catálogo de roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Rol'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/estatus-usuarios:
    get:
      tags:
      - Catálogos
      summary: Consultar estatus de usuario (solo Administrador)
      responses:
        '200':
          description: Catálogo de estatus
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Estatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UsuarioId:
      name: usuarioId
      in: path
      required: true
      description: ID del usuario
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: Solicitud o validación incorrecta
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Falta token válido o las credenciales no son válidas
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: El usuario no tiene los permisos necesarios
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Recurso duplicado o regla de negocio impedida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    LoginRequest:
      type: object
      required:
      - correo
      - password
      additionalProperties: false
      properties:
        correo:
          type: string
          format: email
          example: alumno@ejemplo.com
        password:
          type: string
          format: password
          example: MiClaveSegura123!
    LoginResponse:
      type: object
      description: Esquema orientativo; ajustar nombres exactos según respuesta actual de Express.
      properties:
        token:
          type: string
          description: JWT de acceso
        expires_in:
          type: integer
          example: 3600
        usuario:
          $ref: '#/components/schemas/Usuario'
    CrearUsuarioRequest:
      type: object
      additionalProperties: false
      required:
      - correo
      - password
      - rol_id
      description: El Administrador crea la cuenta. El campo de identificador anterior ya no forma parte de
        la solicitud.
      properties:
        correo:
          type: string
          format: email
          example: alumno@ejemplo.com
        password:
          type: string
          format: password
          minLength: 8
          example: ClaveSegura123!
        rol_id:
          type: integer
          minimum: 1
          description: ID real del catálogo de roles; no asumir que Alumno siempre es 3
    ActualizarCorreoRequest:
      type: object
      required:
      - correo
      additionalProperties: false
      properties:
        correo:
          type: string
          format: email
    CambiarPasswordRequest:
      type: object
      required:
      - password_actual
      - password_nueva
      additionalProperties: false
      properties:
        password_actual:
          type: string
          format: password
        password_nueva:
          type: string
          format: password
    Usuario:
      type: object
      description: Representación orientativa del usuario, sin datos de contraseña ni el antiguo identificador.
      properties:
        usuario_id:
          type: integer
          example: 12
        correo:
          type: string
          format: email
          example: alumno@ejemplo.com
        rol_id:
          type: integer
          example: 3
        rol:
          type: string
          example: Alumno
        estatus_id:
          type: integer
          example: 1
        estatus:
          type: string
          example: Activo
        fecha_creacion:
          type: string
          format: date-time
    ListaUsuarios:
      type: object
      properties:
        usuarios:
          type: array
          items:
            $ref: '#/components/schemas/Usuario'
        total:
          type: integer
          example: 25
        pagina:
          type: integer
          example: 1
        limite:
          type: integer
          example: 10
    Rol:
      type: object
      properties:
        rol_id:
          type: integer
          example: 3
        nombre:
          type: string
          example: Alumno
    Estatus:
      type: object
      properties:
        estatus_id:
          type: integer
          example: 1
        nombre:
          type: string
          example: Activo
    Error:
      type: object
      description: Formato orientativo; confirmar con los manejadores de errores actuales.
      properties:
        error:
          type: string
          example: CREDENCIALES_INVALIDAS
        mensaje:
          type: string
          example: Solicitud no válida
    ActualizarCorreoPropioRequest:
      type: object
      additionalProperties: false
      required:
      - correo
      - password
      properties:
        correo:
          type: string
          format: email
          example: nuevo@ejemplo.com
        password:
          type: string
          format: password
          description: Contraseña actual (no la nueva)
    ActualizarCorreoPropioResponse:
      type: object
      properties:
        mensaje:
          type: string
          example: Correo actualizado correctamente
        usuario:
          type: object
          properties:
            usuario_id:
              type: integer
              example: 2
            correo:
              type: string
              format: email
              example: nuevo@ejemplo.com
