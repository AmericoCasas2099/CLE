openapi: 3.0.3
info:
  title: CLE - API del microservicio académico
  version: 1.0.0
  description: |
    Documentación de los módulos de maestros y alumnos del Centro de Lenguas Extranjeras.
    Los usuarios son creados por el Administrador mediante usuarios-service.
    Las rutas /mi-perfil utilizan el usuario_id obtenido del campo sub del JWT.
    Las certificaciones y los catálogos académicos se documentarán al implementarse.
servers:
  - url: http://localhost:3002
    description: Desarrollo local
security:
  - bearerAuth: []
tags:
  - name: Salud
  - name: Maestros
  - name: Alumnos
paths:
  /health:
    get:
      tags: [Salud]
      summary: Estado del microservicio y su conexión a PostgreSQL
      security: []
      responses:
        '200':
          description: Servicio y base de datos disponibles
          content:
            application/json:
              schema:
                type: object
                properties:
                  servicio: {type: string, example: academico-service}
                  estado: {type: string, example: ok}
                  base_datos: {type: string, example: conectada}
        '503': {$ref: '#/components/responses/ErrorServicio'}
  /api/v1/maestros:
    post:
      tags: [Maestros]
      summary: Registrar maestro (Administrador)
      description: La cuenta debe existir en usuarios-service, tener rol Maestro y estar activa.
      x-roles-permitidos: [Administrador]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CrearMaestroAdmin'}
      responses:
        '201':
          description: Maestro registrado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespuestaMaestro'}
        '400': {$ref: '#/components/responses/ErrorValidacion'}
        '401': {$ref: '#/components/responses/ErrorAutenticacion'}
        '403': {$ref: '#/components/responses/ErrorProhibido'}
        '409': {$ref: '#/components/responses/ErrorConflicto'}
    get:
      tags: [Maestros]
      summary: Listar maestros (Administrador)
      x-roles-permitidos: [Administrador]
      parameters:
        - {$ref: '#/components/parameters/Pagina'}
        - {$ref: '#/components/parameters/Limite'}
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                type: object
                properties:
                  maestros:
                    type: array
                    items: {$ref: '#/components/schemas/Maestro'}
                  total: {type: integer, example: 2}
                  pagina: {type: integer, example: 1}
                  limite: {type: integer, example: 10}
        '401': {$ref: '#/components/responses/ErrorAutenticacion'}
        '403': {$ref: '#/components/responses/ErrorProhibido'}
  /api/v1/maestros/mi-perfil:
    get:
      tags: [Maestros]
      summary: Consultar mi perfil de maestro
      description: Se busca el perfil usando el campo sub del JWT verificado.
      x-roles-permitidos: [Maestro]
      responses:
        '200':
          description: Perfil encontrado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespuestaMaestro'}
        '401': {$ref: '#/components/responses/ErrorAutenticacion'}
        '403': {$ref: '#/components/responses/ErrorProhibido'}
        '404': {$ref: '#/components/responses/ErrorNoEncontrado'}
    post:
      tags: [Maestros]
      summary: Registrar mi perfil de maestro
      description: No recibe usuario_id ni estatus_id. El usuario se obtiene del JWT.
      x-roles-permitidos: [Maestro]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DatosMaestro'}
      responses:
        '201':
          description: Perfil creado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespuestaMaestro'}
        '400': {$ref: '#/components/responses/ErrorValidacion'}
        '401': {$ref: '#/components/responses/ErrorAutenticacion'}
        '403': {$ref: '#/components/responses/ErrorProhibido'}
        '409': {$ref: '#/components/responses/ErrorConflicto'}
  /api/v1/maestros/{id}:
    parameters:
      - {$ref: '#/components/parameters/MaestroId'}
    get:
      tags: [Maestros]
      summary: Consultar maestro por ID
      description: Administrador puede consultar cualquiera; Maestro solo el perfil asociado a su usuario_id.
      x-roles-permitidos: [Administrador, Maestro propietario]
      responses:
        '200':
          description: Maestro encontrado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespuestaMaestro'}
        '401': {$ref: '#/components/responses/ErrorAutenticacion'}
        '403': {$ref: '#/components/responses/ErrorProhibido'}
        '404': {$ref: '#/components/responses/ErrorNoEncontrado'}
    patch:
      tags: [Maestros]
      summary: Modificar maestro
      description: Administrador o Maestro propietario. No permite cambiar usuario_id ni estatus_id.
      x-roles-permitidos: [Administrador, Maestro propietario]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ModificarMaestro'}
      responses:
        '200':
          description: Maestro actualizado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespuestaMaestro'}
        '400': {$ref: '#/components/responses/ErrorValidacion'}
        '401': {$ref: '#/components/responses/ErrorAutenticacion'}
        '403': {$ref: '#/components/responses/ErrorProhibido'}
        '404': {$ref: '#/components/responses/ErrorNoEncontrado'}
  /api/v1/maestros/{id}/estatus:
    parameters:
      - {$ref: '#/components/parameters/MaestroId'}
    patch:
      tags: [Maestros]
      summary: Activar o inhabilitar maestro (Administrador)
      description: |
        Este contrato utiliza el nombre del estatus, igual que usuarios-service y alumnos.
        Si el controlador desplegado de maestros aún recibe estatus_id, debe adaptarse
        antes de considerar esta operación sincronizada con el código.
      x-roles-permitidos: [Administrador]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CambiarEstatus'}
      responses:
        '200':
          description: Estatus actualizado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespuestaMaestro'}
        '400': {$ref: '#/components/responses/ErrorValidacion'}
        '401': {$ref: '#/components/responses/ErrorAutenticacion'}
        '403': {$ref: '#/components/responses/ErrorProhibido'}
        '404': {$ref: '#/components/responses/ErrorNoEncontrado'}
  /api/v1/alumnos:
    post:
      tags: [Alumnos]
      summary: Registrar alumno (Administrador)
      description: La cuenta debe existir en usuarios-service, tener rol Alumno y estar activa.
      x-roles-permitidos: [Administrador]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CrearAlumnoAdmin'}
      responses:
        '201':
          description: Alumno registrado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespuestaAlumno'}
        '400': {$ref: '#/components/responses/ErrorValidacion'}
        '401': {$ref: '#/components/responses/ErrorAutenticacion'}
        '403': {$ref: '#/components/responses/ErrorProhibido'}
        '409': {$ref: '#/components/responses/ErrorConflicto'}
    get:
      tags: [Alumnos]
      summary: Listar alumnos (Administrador)
      x-roles-permitidos: [Administrador]
      parameters:
        - {$ref: '#/components/parameters/Pagina'}
        - {$ref: '#/components/parameters/Limite'}
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                type: object
                required: [alumnos, total, pagina, limite]
                properties:
                  alumnos:
                    type: array
                    items: {$ref: '#/components/schemas/Alumno'}
                  total: {type: integer, example: 10}
                  pagina: {type: integer, example: 1}
                  limite: {type: integer, example: 10}
        '401': {$ref: '#/components/responses/ErrorAutenticacion'}
        '403': {$ref: '#/components/responses/ErrorProhibido'}
  /api/v1/alumnos/mi-perfil:
    get:
      tags: [Alumnos]
      summary: Consultar mi perfil de alumno
      description: Utiliza el usuario_id del campo sub del JWT verificado.
      x-roles-permitidos: [Alumno]
      responses:
        '200':
          description: Perfil encontrado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespuestaAlumno'}
        '401': {$ref: '#/components/responses/ErrorAutenticacion'}
        '403': {$ref: '#/components/responses/ErrorProhibido'}
        '404': {$ref: '#/components/responses/ErrorNoEncontrado'}
    post:
      tags: [Alumnos]
      summary: Registrar mi perfil de alumno
      description: |
        No recibe usuario_id: se obtiene del JWT. Para Interno son obligatorios
        matricula, carrera_id y semestre. Para Externo estos campos deben omitirse o ser null.
      x-roles-permitidos: [Alumno]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DatosAlumno'}
            examples:
              interno:
                summary: Alumno interno
                value:
                  tipo_alumno_id: 1
                  matricula: '21140001'
                  nombre: Ana
                  apellido_paterno: López
                  apellido_materno: García
                  telefono: '4421234567'
                  carrera_id: 1
                  semestre: 5
              externo:
                summary: Alumno externo
                value:
                  tipo_alumno_id: 2
                  nombre: Luis
                  apellido_paterno: Torres
                  telefono: '4429876543'
      responses:
        '201':
          description: Perfil creado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespuestaAlumno'}
        '400': {$ref: '#/components/responses/ErrorValidacion'}
        '401': {$ref: '#/components/responses/ErrorAutenticacion'}
        '403': {$ref: '#/components/responses/ErrorProhibido'}
        '409': {$ref: '#/components/responses/ErrorConflicto'}
  /api/v1/alumnos/{id}:
    parameters:
      - {$ref: '#/components/parameters/AlumnoId'}
    get:
      tags: [Alumnos]
      summary: Consultar alumno por ID
      description: Administrador puede consultar cualquiera; Alumno solo su propio perfil.
      x-roles-permitidos: [Administrador, Alumno propietario]
      responses:
        '200':
          description: Alumno encontrado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespuestaAlumno'}
        '401': {$ref: '#/components/responses/ErrorAutenticacion'}
        '403': {$ref: '#/components/responses/ErrorProhibido'}
        '404': {$ref: '#/components/responses/ErrorNoEncontrado'}
    patch:
      tags: [Alumnos]
      summary: Modificar alumno
      description: |
        Administrador puede modificar datos personales y académicos.
        Alumno propietario solo nombre, apellidos y teléfono; no matrícula, carrera,
        semestre, tipo_alumno_id, estatus_id ni usuario_id.
      x-roles-permitidos: [Administrador, Alumno propietario]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ModificarAlumno'}
      responses:
        '200':
          description: Alumno actualizado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespuestaAlumno'}
        '400': {$ref: '#/components/responses/ErrorValidacion'}
        '401': {$ref: '#/components/responses/ErrorAutenticacion'}
        '403': {$ref: '#/components/responses/ErrorProhibido'}
        '404': {$ref: '#/components/responses/ErrorNoEncontrado'}
        '409': {$ref: '#/components/responses/ErrorConflicto'}
  /api/v1/alumnos/{id}/estatus:
    parameters:
      - {$ref: '#/components/parameters/AlumnoId'}
    patch:
      tags: [Alumnos]
      summary: Activar o inhabilitar alumno (Administrador)
      x-roles-permitidos: [Administrador]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CambiarEstatus'}
      responses:
        '200':
          description: Estatus actualizado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespuestaAlumno'}
        '400': {$ref: '#/components/responses/ErrorValidacion'}
        '401': {$ref: '#/components/responses/ErrorAutenticacion'}
        '403': {$ref: '#/components/responses/ErrorProhibido'}
        '404': {$ref: '#/components/responses/ErrorNoEncontrado'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT emitido por usuarios-service mediante POST /api/v1/auth/login.
  parameters:
    MaestroId:
      name: id
      in: path
      required: true
      description: maestro_id, no usuario_id.
      schema: {type: integer, minimum: 1}
    AlumnoId:
      name: id
      in: path
      required: true
      description: alumno_id, no usuario_id.
      schema: {type: integer, minimum: 1}
    Pagina:
      name: pagina
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    Limite:
      name: limite
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 10}
  schemas:
    DatosMaestro:
      type: object
      additionalProperties: false
      required: [nombre, apellido_paterno]
      properties:
        nombre: {type: string, minLength: 1, maxLength: 100, example: Christopher}
        apellido_paterno: {type: string, minLength: 1, maxLength: 100, example: Vega}
        apellido_materno: {type: string, nullable: true, maxLength: 100, example: Ángeles}
        telefono: {type: string, nullable: true, pattern: '^[0-9]{10}$', example: '4421234567'}
        especialidad: {type: string, nullable: true, maxLength: 100, example: Inglés}
    CrearMaestroAdmin:
      allOf:
        - {$ref: '#/components/schemas/DatosMaestro'}
        - type: object
          required: [usuario_id]
          properties:
            usuario_id: {type: integer, minimum: 1, example: 5}
    ModificarMaestro:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nombre: {type: string, minLength: 1, maxLength: 100}
        apellido_paterno: {type: string, minLength: 1, maxLength: 100}
        apellido_materno: {type: string, nullable: true, maxLength: 100}
        telefono: {type: string, nullable: true, pattern: '^[0-9]{10}$'}
        especialidad: {type: string, nullable: true, maxLength: 100}
    Maestro:
      type: object
      properties:
        maestro_id: {type: integer, example: 1}
        usuario_id: {type: integer, example: 5}
        nombre: {type: string, example: Christopher}
        apellido_paterno: {type: string, example: Vega}
        apellido_materno: {type: string, nullable: true, example: Ángeles}
        telefono: {type: string, nullable: true, example: '4421234567'}
        especialidad: {type: string, nullable: true, example: Inglés}
        estatus_id: {type: integer, example: 1}
        estatus: {type: string, example: Activo}
    RespuestaMaestro:
      type: object
      properties:
        maestro: {$ref: '#/components/schemas/Maestro'}
    DatosAlumno:
      type: object
      additionalProperties: false
      required: [tipo_alumno_id, nombre, apellido_paterno]
      description: |
        La obligatoriedad de matricula, carrera_id y semestre depende del
        tipo de alumno obtenido del catálogo: Interno requiere los tres;
        Externo debe dejarlos en null u omitirlos.
      properties:
        tipo_alumno_id: {type: integer, minimum: 1, example: 1}
        matricula: {type: string, nullable: true, minLength: 1, maxLength: 50, example: '21140001'}
        nombre: {type: string, minLength: 1, maxLength: 100, example: Ana}
        apellido_paterno: {type: string, minLength: 1, maxLength: 100, example: López}
        apellido_materno: {type: string, nullable: true, maxLength: 100, example: García}
        telefono: {type: string, nullable: true, pattern: '^[0-9]{10}$', example: '4421234567'}
        carrera_id: {type: integer, nullable: true, minimum: 1, example: 1}
        semestre: {type: integer, nullable: true, minimum: 1, maximum: 20, example: 5}
    CrearAlumnoAdmin:
      allOf:
        - {$ref: '#/components/schemas/DatosAlumno'}
        - type: object
          required: [usuario_id]
          properties:
            usuario_id: {type: integer, minimum: 1, example: 8}
    ModificarAlumno:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        tipo_alumno_id: {type: integer, minimum: 1}
        matricula: {type: string, nullable: true, minLength: 1, maxLength: 50}
        nombre: {type: string, minLength: 1, maxLength: 100}
        apellido_paterno: {type: string, minLength: 1, maxLength: 100}
        apellido_materno: {type: string, nullable: true, maxLength: 100}
        telefono: {type: string, nullable: true, pattern: '^[0-9]{10}$'}
        carrera_id: {type: integer, nullable: true, minimum: 1}
        semestre: {type: integer, nullable: true, minimum: 1, maximum: 20}
    Alumno:
      type: object
      properties:
        alumno_id: {type: integer, example: 1}
        usuario_id: {type: integer, example: 8}
        tipo_alumno_id: {type: integer, example: 1}
        tipo_alumno: {type: string, example: Interno}
        matricula: {type: string, nullable: true, example: '21140001'}
        nombre: {type: string, example: Ana}
        apellido_paterno: {type: string, example: López}
        apellido_materno: {type: string, nullable: true, example: García}
        telefono: {type: string, nullable: true, example: '4421234567'}
        carrera_id: {type: integer, nullable: true, example: 1}
        carrera: {type: string, nullable: true, example: Ingeniería en Sistemas Computacionales}
        semestre: {type: integer, nullable: true, example: 5}
        estatus_id: {type: integer, example: 1}
        estatus: {type: string, example: Activo}
    RespuestaAlumno:
      type: object
      properties:
        alumno: {$ref: '#/components/schemas/Alumno'}
    CambiarEstatus:
      type: object
      additionalProperties: false
      required: [estatus]
      properties:
        estatus: {type: string, enum: [Activo, Inactivo], example: Inactivo}
    Error:
      type: object
      properties:
        error: {type: string, example: DATOS_INVALIDOS}
        mensaje: {type: string, example: Los datos proporcionados son inválidos}
        detalles:
          type: array
          items:
            type: object
            properties:
              campo: {type: string, example: telefono}
              mensaje: {type: string, example: El teléfono debe contener exactamente 10 dígitos}
  responses:
    ErrorValidacion:
      description: Solicitud inválida o incumplimiento de regla de negocio
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ErrorAutenticacion:
      description: Token ausente, inválido o expirado
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ErrorProhibido:
      description: El usuario no tiene permiso para esta operación
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ErrorNoEncontrado:
      description: No existe el registro solicitado o el perfil aún no está registrado
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ErrorConflicto:
      description: Perfil existente o matrícula duplicada
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ErrorServicio:
      description: Servicio o base de datos no disponible
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
